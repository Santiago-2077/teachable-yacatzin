<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector PET – Reciclaje Yacatzin</title>
    <link rel="icon" href="assets/img/icon-512.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <div class="page">
        <a href="https://reciclajeyacatzin.app" target="_blank"><img src="assets/img/titulo-slogan.webp"
                alt="Reciclaje Yacatzin" class="logo"></a>

        <div class="card">
            <p class="card-title">Detector de Botellas PET</p>

            <img id="mascot" src="assets/img/pet-yacatzin.png" alt="Yacatzin" class="mascot">

            <div id="webcam-container"></div>

            <div class="btn-group">
                <button class="btn-start" id="btn-start" onclick="init()">Iniciar cámara</button>
                <button class="btn-stop" id="btn-stop" onclick="stopCamera()">Detener cámara</button>
            </div>

            <div class="result-box" id="result-box">
                <span class="result-label" id="result-label"></span>
                <span class="result-text" id="result-text"></span>
            </div>
        </div>
    </div>

    <div id="label-container" hidden></div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
